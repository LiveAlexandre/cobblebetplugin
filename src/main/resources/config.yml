############################################################
#                CobbleBet Economy Configuration           #
############################################################

# ----------------------------------------
# ECONOMY BACKEND
# ----------------------------------------

# Type of economy system used by the plugin
# Options:
#   - "item"  → physical item-based economy (e.g. DIAMOND)
#   - "vault" → Vault-compatible economy plugin (EssentialsX, etc.)
economyType: "vault"

# Only used when economyType = "item"
economyItem: "DIAMOND"

# Optional display-name override when economyType = "vault".
# Leave blank to use the currency name provided by the Vault economy plugin.
vaultCurrencyName: ""

# Automatically download verified CobbleBet updates into plugins/update.
# The staged update is installed safely the next time the server restarts.
autoUpdate: true

# ----------------------------------------
# PERMISSIONS
# ----------------------------------------

# Command permission requirements controlled by the CobbleBet owner panel.
# Set a value to false to allow all players to use that command.
permissions:
  gamble: false
  admin: true
  walletAdmin: true

#default permission is (Cobblebet.gamble)
gambleCommandNeedsPermission: false


# ----------------------------------------
# BALANCE SETTINGS
# ----------------------------------------

# Maximum balance allowed (anti overflow / economy cap)
maximumBalance: 999999



# ----------------------------------------
# DATABASE / PERSISTENCE (optional future-proofing)
# ----------------------------------------

database:
  enabled: false
  autosaveIntervalSeconds: 60


# ----------------------------------------
# COBBLEBET+ SUBSCRIPTION
# ----------------------------------------

# Only required if using premium features
# Approval key issued by CobbleBet staff. Set it with /cobblebet key <approval-key>. Keep it secret.
cobblebetToken: ""

# Optional name shown in the CobbleBet admin dashboard. Blank uses the server MOTD.
serverName: ""

# Enables premium features if token is valid
premiumEnabled: true


# ----------------------------------------
# BROADCAST SYSTEM
# ----------------------------------------

broadcastingEnabled: true

broadcastPrefix: "<gradient:#00ff88:#00c3ff><bold>CobbleBet</bold></gradient> <dark_gray>»</dark_gray>"

# Controls what gets broadcasted
broadcastEvents:
  bigWin: true
  jackpot: true


# Minimum win amount required for broadcast
bigWinThreshold: 500


# ----------------------------------------
# DEBUG / DEVELOPMENT
# ----------------------------------------

debug:
  testMode: false

# ----------------------------------------
# IN-GAME GAMBLING VISUALS
# ----------------------------------------
# Quality options: low, balanced, high
gamblingVisuals:
  enabled: true
  quality: balanced
  sounds: true
  volume: 0.35
  screenTitles: true
  actionBar: true
  visibleToNearbyPlayers: true
  reducedMotion: false
  maxActive: 32
  viewDistance: 20

# ----------------------------------------
# WEBSITE CUSTOMIZATION (owner panel)
# New game settings apply to new bets. Do not move above other sections.
# Background image is a resized data URL so it survives server restarts.
# ----------------------------------------
websiteCustomization:
  initialized: false
  theme: classic
  playerMessage: ""
  enabledGames:
    mines: true
    blackjack: true
    roulette: true
    coinflip: true
    plinko: true
    dice: true
    crash: true
  gameRules:
    mines:
      percent: 0.0
    blackjack:
      percent: 0.0
    roulette:
      percent: 0.0
    coinflip:
      percent: 0.0
      maxAmount: 1000000000000.0
    plinko:
      percent: 0.0
    dice:
      percent: 0.0
    crash:
      percent: 0.0
  background:
    image: ""
    blur: 8
  maintenance:
    enabled: false
    message: "Games are temporarily unavailable while this server completes maintenance."
  ownerAlerts:
    connection: true
    economy: true
    transactions: true
    updates: true
    unusualActivity: true
    maintenance: true

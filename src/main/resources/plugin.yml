name: CobbleBet
version: '${version}'

main: me.cobbleBet.Main
api-version: '1.21'
load: POSTWORLD

commands:
  gamble:
  mines:
    description: Shows players how to open Mines.
  blackjack:
    aliases: [bj]
    description: Shows players how to open Blackjack.
  roulette:
    description: Shows players how to open Roulette.
  coinflip:
    aliases: [cf]
    description: Shows players how to open Coinflip.
  plinko:
    description: Shows players how to open Plinko.
  dice:
    description: Shows players how to open Dice.
  crash:
    description: Shows players how to open Crash.
  wallet:
  cobblebet:
permissions:
  cobblebet.admin:
    description: Manage CobbleBet settings and receive plugin update notices.
    default: op
  cobblebet.gamble:
    description: Gamble :D
    default: op
  cobblebet.wallet.admin:
    description: Manage CobbleBet player wallet balances.
    default: op
